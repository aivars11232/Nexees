# The one Rust toolchain for Nexees (DEP-RUST in docs/dependencies): the release the shared core
# was proven with, its formatter and linter, and the Desktop and Android targets. rustup installs
# exactly this toolchain for anyone building in this checkout.
[toolchain]
channel = "1.99.0"
components = ["rustfmt", "clippy"]
targets = ["x86_64-unknown-linux-gnu", "x86_64-linux-android", "aarch64-linux-android"]
profile = "minimal"
