# cargo-deny policy for the TASK-003 feasibility crate: every target it is
# built for, RustSec advisories, an explicit license allowlist, and crates.io
# as the only source. The owner's unpublished LCL crates (publish = false)
# carry no license field; they are reviewed separately in the dependency
# inventory, so cargo-deny treats them as private.
[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-linux-android", "aarch64-linux-android"]

[advisories]
yanked = "deny"

[licenses]
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies of unpublished crates (this crate and the LCL engine)
# have no version requirement; registry dependencies still may not use "*".
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
